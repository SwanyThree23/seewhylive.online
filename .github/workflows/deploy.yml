name: Build & Deploy to VPS

on:
  push:
    branches:
      - claude/seewhy-live-v33-build-v0L5Z
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "✓ Frontend built"

      - name: Trigger VPS deploy via webhook
        run: |
          HTTP=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" -X POST \
            https://seewhylive.online/api/webhooks/deploy \
            -H "x-deploy-token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30 || echo "000")
          echo "Webhook status: $HTTP"
          cat /tmp/deploy_resp.txt || true
          if [ "$HTTP" = "200" ]; then
            echo "✅ VPS reload queued — https://seewhylive.online"
          else
            echo "⚠️  VPS webhook returned HTTP $HTTP (timeout or unreachable — server may need manual restart)"
          fi
          # Never fail CI on webhook issues — frontend deploys via Vercel separately
