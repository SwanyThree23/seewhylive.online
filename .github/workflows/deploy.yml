name: Build & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.24.194.112
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist/*"
          target: "/opt/seewhy/frontend/dist/"
          strip_components: 1

      - name: Reload nginx & restart PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 2.24.194.112
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Ensure dist dir exists and is owned properly
            mkdir -p /opt/seewhy/frontend/dist
            chown -R www-data:www-data /opt/seewhy/frontend/dist 2>/dev/null || true
            # Test nginx config and reload
            nginx -t && nginx -s reload
            echo "=== Deploy complete at $(date) ==="
            echo "=== Serving: $(ls /opt/seewhy/frontend/dist/ | wc -l) files ==="
