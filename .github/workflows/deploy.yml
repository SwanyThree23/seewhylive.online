name: Build & Deploy to VPS

on:
  push:
    branches:
      - claude/seewhy-live-v33-build-v0L5Z
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "✓ Frontend built"

      - name: Trigger VPS deploy via webhook
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://srv1581658.hstgr.cloud:3001/api/webhooks/deploy \
            -H "x-deploy-token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 15 --insecure)
          echo "Webhook status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "✅ Deploy complete — https://seewhylive.online"
          else
            echo "⚠️ Webhook returned HTTP $HTTP"
            exit 1
          fi
