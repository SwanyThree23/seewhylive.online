name: Build & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      # ── Deploy frontend dist ────────────────────────────────────────────
      - name: Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.24.194.112
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist/"
          target: "/opt/seewhy/frontend/"
          strip_components: 0

      # ── Deploy server files ─────────────────────────────────────────────
      - name: Upload server to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.24.194.112
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "server/"
          target: "/opt/seewhy/"
          strip_components: 0

      # ── Install deps, reload nginx, restart PM2 ─────────────────────────
      - name: Restart services on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 2.24.194.112
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            # Server: install production deps and restart
            cd /opt/seewhy/server
            npm install --production --silent
            pm2 restart seewhy-server 2>/dev/null || pm2 start /opt/seewhy/server/index.js --name seewhy-server
            pm2 save

            # Frontend: fix ownership and reload nginx
            chown -R www-data:www-data /opt/seewhy/frontend/dist 2>/dev/null || true
            nginx -t && nginx -s reload

            echo ""
            echo "=== Deploy complete: $(date) ==="
            echo "Frontend: $(ls /opt/seewhy/frontend/dist/ | wc -l) files"
            pm2 list
