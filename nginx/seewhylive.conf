server {
    listen 80;
    server_name seewhylive.online www.seewhylive.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seewhylive.online www.seewhylive.online;

    ssl_certificate /etc/letsencrypt/live/seewhylive.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seewhylive.online/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/seewhy/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
