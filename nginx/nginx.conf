worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load RTMP module (provided by libnginx-mod-rtmp on Ubuntu)
load_module modules/ngx_rtmp_module.so;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# ============================================================
# RTMP — live ingest + HLS transcoding
# ============================================================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        timeout 30s;

        application live {
            live on;
            record off;

            # HLS output
            hls on;
            hls_path /var/www/html/hls;
            hls_fragment 2s;
            hls_playlist_length 30s;
            hls_cleanup on;

            # Allow publish from localhost and VPS IP only; deny all others.
            allow publish 127.0.0.1;
            allow publish 2.24.198.112;
            deny  publish all;
            allow play all;
        }
    }
}

# ============================================================
# HTTP
# ============================================================
http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens     off;

    # ----------------------------------------------------------
    # Gzip compression
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.apple.mpegurl
        image/svg+xml;

    # ----------------------------------------------------------
    # Backend upstream
    # ----------------------------------------------------------
    upstream backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # ----------------------------------------------------------
    # HTTP → HTTPS redirect
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name _;
        # ACME challenge passthrough for certbot
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------
    # HTTPS main server
    # ----------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name seewhylive.online www.seewhylive.online srv1587098.hstgr.cloud 2.24.198.112;

        # SSL — Let's Encrypt (certbot --nginx -d seewhylive.online -d www.seewhylive.online)
        ssl_certificate     /etc/letsencrypt/live/seewhylive.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seewhylive.online/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;

        root /opt/seewhy/frontend/dist;
        index index.html;

        client_max_body_size 50M;

        # --------------------------------------------------------
        # API proxy → Node backend
        # --------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # --------------------------------------------------------
        # Socket.io proxy — WebSocket upgrade
        # --------------------------------------------------------
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
            proxy_cache        off;
        }

        # --------------------------------------------------------
        # HLS segments
        # --------------------------------------------------------
        location /hls/ {
            alias /var/www/html/hls/;

            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Cache-Control no-cache always;
            add_header Pragma no-cache;
            add_header Expires 0;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # --------------------------------------------------------
        # Service Worker — must never be cached by browser
        # --------------------------------------------------------
        location = /sw.js {
            root /opt/seewhy/frontend/dist;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # --------------------------------------------------------
        # Frontend SPA — React app
        # --------------------------------------------------------
        location / {
            root /opt/seewhy/frontend/dist;
            try_files $uri $uri/ /index.html;

            # HTML must never be cached — always serve fresh so SW self-update script runs
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            # Cache static assets aggressively (hashed filenames — safe)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
